<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="B.Tech CSE Section B daily timetable">
  <link rel="manifest" href="manifest.json">
  <title>Timetable B</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --card:#fff; --text:#111827; --muted:#667085; --line:#e5e7eb; --accent:#2563eb; --accent-soft:#dbeafe; --live:#16a34a; --live-soft:#dcfce7; --next:#d97706; --next-soft:#fef3c7; --done:#98a2b3; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#151b2d; --text:#f8fafc; --muted:#a8b0c2; --line:#2b344a; --accent:#60a5fa; --accent-soft:#1e3a5f; --live:#4ade80; --live-soft:#153b26; --next:#fbbf24; --next-soft:#49351a; --done:#667085; } }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:560px; margin:auto; padding:20px 14px 28px; }
    .top { display:flex; justify-content:space-between; align-items:end; gap:12px; margin-bottom:14px; }
    h1 { font-size:24px; margin:0; letter-spacing:-.4px; }
    .subtitle { color:var(--muted); font-size:13px; margin-top:4px; }
    .today { background:var(--accent-soft); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:7px 11px; font-size:12px; font-weight:800; white-space:nowrap; }
    .today.live-badge { background:var(--live-soft); color:var(--live); border-color:var(--live); }
    .today.break-badge { background:var(--next-soft); color:var(--next); border-color:var(--next); }
    .days { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:12px; }
    button { font:inherit; }
    .day { min-height:44px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); font-weight:700; cursor:pointer; }
    .day.active { background:var(--accent); color:white; border-color:var(--accent); }
    .day.today-day:not(.active) { outline:2px solid var(--accent); outline-offset:1px; }
    .today-jump { display:none; width:100%; margin:0 0 12px; min-height:40px; border:1px solid var(--accent); border-radius:11px; background:var(--accent-soft); color:var(--text); font-weight:800; cursor:pointer; }
    .today-jump.visible { display:block; }
    .status { display:none; margin:0 0 12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .status.visible { display:block; }
    .status-main { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .status-label { font-size:11px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
    .status-title { font-size:14px; font-weight:800; margin-top:2px; }
    .countdown { font-size:14px; font-weight:900; white-space:nowrap; }
    .status.live .countdown { color:var(--live); }
    .status.next .countdown { color:var(--next); }
    .status.break .countdown { color:var(--next); }
    .date { color:var(--muted); font-size:12px; margin:0 2px 10px; }
    .classes { display:grid; gap:10px; }
    .class { display:grid; grid-template-columns:78px 1fr; gap:10px; align-items:stretch; }
    .time { padding:13px 4px; color:var(--muted); font-size:12px; font-weight:700; text-align:center; }
    .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px; transition:transform .2s, border-color .2s, box-shadow .2s, opacity .2s; }
    .card.live { border:2px solid var(--live); box-shadow:0 0 0 3px color-mix(in srgb, var(--live) 14%, transparent); transform:translateY(-1px); }
    .card.next { border-color:var(--next); box-shadow:0 0 0 2px color-mix(in srgb, var(--next) 10%, transparent); }
    .class.done .card { opacity:.58; }
    .class.done .time { opacity:.58; }
    .subject { font-weight:800; line-height:1.25; padding-right:76px; }
    .code { color:var(--muted); font-size:11px; margin-top:5px; }
    .type { display:inline-block; margin-top:8px; padding:3px 7px; border-radius:999px; background:var(--accent-soft); font-size:10px; font-weight:800; }
    .live-pill, .next-pill { position:absolute; top:11px; right:11px; display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:999px; font-size:9px; font-weight:900; letter-spacing:.3px; }
    .live-pill { background:var(--live-soft); color:var(--live); }
    .next-pill { background:var(--next-soft); color:var(--next); }
    .live-dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:livePulse 1.4s ease-in-out infinite; }
    @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.75)} }
    .empty { background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:26px 16px; text-align:center; color:var(--muted); }
    .footer { margin-top:20px; text-align:center; color:var(--muted); font-size:11px; line-height:1.5; }
    @media (max-width:360px) { main{padding-left:10px;padding-right:10px}.days{gap:4px}.day{font-size:12px}.class{grid-template-columns:70px 1fr}.time{font-size:11px}.subject{padding-right:70px}.live-pill,.next-pill{right:8px}.countdown{font-size:12px} }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 id="title">Today's Timetable</h1>
      <div class="subtitle">B.Tech CSE · Section B</div>
    </div>
    <div class="today" id="todayBadge">Today</div>
  </div>
  <div class="days" id="days" aria-label="Choose a day"></div>
  <button type="button" class="today-jump" id="todayJump">↩ Back to Today</button>
  <div class="status" id="status" aria-live="polite">
    <div class="status-main">
      <div><div class="status-label" id="statusLabel"></div><div class="status-title" id="statusTitle"></div></div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
  <div class="date" id="dateLabel"></div>
  <section class="classes" id="classes" aria-live="polite"></section>
  <div class="footer">Based on the uploaded 3rd Semester 2026–27 timetable for Section B.</div>
</main>
<script>
const timetable = {
  Monday: [
    ["09:05–09:55","Data Structures and Algorithms","CSD201B","Room C-407"],
    ["11:15–12:05","Indian Constitution, Human Rights and Professional Ethics","LAN201B","CSE B / Faculty B"],
    ["12:55–01:45","Data Structures and Algorithms","CSD201B","Room C-407"],
    ["03:20–04:10","Discrete Mathematics","CSD208B","Room C-407"],
    ["04:10–05:00","Software Development Fundamental","CSD203B","Room C-407"]
  ],
  Tuesday: [
    ["09:05–09:55","Logic Design","CSD202B","Room C-407"],
    ["09:55–10:45","Probability and Statistics","MTE301B","Room C-407"],
    ["11:15–12:55","Logic Design Lab / Programming Paradigms Lab / Software Development Fundamentals Lab","CSD202B / CSD207B / CSC203B","B3-A103A / B1-A103C / B2-A103E"],
    ["12:55–01:45","Discrete Mathematics","CSD208B","Room C-407"],
    ["03:20–04:10","Data Structures and Algorithms Lab","CSD201B","B3-A103D"],
    ["04:10–05:00","Foundation Mathematics-1","—","Room C-407"]
  ],
  Wednesday: [
    ["09:05–09:55","Logic Design","CSD202B","Room C-407"],
    ["11:15–12:55","Logic Design Lab / Programming Paradigms Lab / Software Development Fundamentals Lab","CSD202B / CSD207B / CSC203B","B3-A103A / B1-A103C / B2-A103E"],
    ["03:20–04:10","Software Development Fundamental","CSD203B","Room C-407"],
    ["04:10–05:00","Programming Paradigms","CSD207B","Room C-407"]
  ],
  Thursday: [
    ["09:05–10:45","Data Structures and Algorithms Lab","CSD201B","B2-A103D"],
    ["11:15–12:05","Probability and Statistics","MTE301B","Room C-407"],
    ["12:55–01:45","Data Structures and Algorithms","CSD201B","Room C-407"],
    ["03:20–04:10","Programming Paradigms","CSD207B","Room C-407"],
    ["04:10–05:00","Foundation Mathematics-1","—","Room C-407"]
  ],
  Friday: [
    ["09:05–09:55","Programming Paradigms","CSD207B","Room C-407"],
    ["09:55–10:45","Probability and Statistics","MTE301B","Room C-407"],
    ["11:15–12:55","Logic Design Lab / Programming Paradigms Lab / Software Development Fundamentals Lab","CSD202B / CSD207B / CSC203B","B3-A103A / B1-A103C / B2-A103E"],
    ["12:55–01:45","Discrete Mathematics","CSD208B","Room C-407"],
    ["03:20–04:10","Data Structures and Algorithms Lab","CSD201B","B1-A103G"]
  ],
  Saturday: []
};
const order = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const short = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat"};
const breaks = [
  ["10:45","11:15","Tea Break"],
  ["13:45","14:30","Lunch Break"]
];
const dayEl = document.getElementById("days"), classesEl = document.getElementById("classes"), titleEl = document.getElementById("title"), dateEl = document.getElementById("dateLabel"), badgeEl = document.getElementById("todayBadge"), statusEl = document.getElementById("status"), statusLabelEl = document.getElementById("statusLabel"), statusTitleEl = document.getElementById("statusTitle"), countdownEl = document.getElementById("countdown"), todayJumpEl = document.getElementById("todayJump");
let selectedDay;
function todayName() { return new Intl.DateTimeFormat("en-IN", {weekday:"long"}).format(new Date()); }
function formatDate() { return new Intl.DateTimeFormat("en-IN", {day:"numeric", month:"short", year:"numeric"}).format(new Date()); }
function toMinutes(value) {
  const [rawHour, minute] = value.split(":").map(Number);
  const hour = rawHour <= 5 ? rawHour + 12 : rawHour;
  return hour * 60 + minute;
}
function parseRange(time) {
  const [start, end] = time.split("–");
  return [toMinutes(start), toMinutes(end)];
}
function isToday(selected) { return selected === todayName(); }
function currentMinutes() { const now = new Date(); return now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60; }
function findLiveIndex(list, selected) {
  if (!isToday(selected)) return -1;
  const now = currentMinutes();
  return list.findIndex(([time]) => { const [start,end] = parseRange(time); return now >= start && now < end; });
}
function findNextIndex(list, selected) {
  if (!isToday(selected)) return -1;
  const now = currentMinutes();
  return list.findIndex(([time]) => parseRange(time)[0] > now);
}
function getStatus(list, selected) {
  if (!isToday(selected)) return null;
  const now = currentMinutes();
  const liveIndex = findLiveIndex(list, selected);
  if (liveIndex >= 0) {
    const [time, subject] = list[liveIndex];
    return {kind:"live", label:"Live now", title:subject, target:parseRange(time)[1], prefix:"Ends in "};
  }
  const activeBreak = breaks.find(([start,end]) => now >= toMinutes(start) && now < toMinutes(end));
  if (activeBreak) return {kind:"break", label:activeBreak[2], title:"Enjoy your break", target:toMinutes(activeBreak[1]), prefix:"Ends in "};
  const nextIndex = findNextIndex(list, selected);
  if (nextIndex >= 0) {
    const [time, subject] = list[nextIndex];
    return {kind:"next", label:"Next class", title:subject, target:parseRange(time)[0], prefix:"Starts in "};
  }
  return {kind:"done", label:"Day complete", title:"No more classes today", target:null, prefix:""};
}
function formatDuration(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const hours = Math.floor(seconds / 3600), minutes = Math.floor((seconds % 3600) / 60), secs = seconds % 60;
  if (hours) return `${hours}h ${minutes}m`;
  if (minutes) return `${minutes}m ${secs}s`;
  return `${secs}s`;
}
function updateStatus(list, selected) {
  const info = getStatus(list, selected);
  if (!info) { statusEl.className = "status"; return; }
  statusEl.className = `status visible ${info.kind}`;
  statusLabelEl.textContent = info.label;
  statusTitleEl.textContent = info.title;
  countdownEl.textContent = info.target === null ? "✓" : info.prefix + formatDuration(info.target - currentMinutes());
}
function render(selected, autoScroll = false) {
  selectedDay = selected;
  const today = todayName();
  const viewingToday = selected === today;
  titleEl.textContent = viewingToday ? "Today's Timetable" : selected + " Timetable";
  const list = timetable[selected] || [];
  const liveIndex = findLiveIndex(list, selected);
  const nextIndex = findNextIndex(list, selected);
  badgeEl.textContent = liveIndex >= 0 ? "● LIVE NOW" : (getStatus(list, selected)?.kind === "break" ? "☕ BREAK" : (viewingToday ? "TODAY" : "VIEWING"));
  badgeEl.classList.toggle("live-badge", liveIndex >= 0);
  badgeEl.classList.toggle("break-badge", liveIndex < 0 && getStatus(list, selected)?.kind === "break");
  dateEl.textContent = viewingToday ? formatDate() : "Tap a day above to switch";
  todayJumpEl.classList.toggle("visible", !viewingToday);
  dayEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.day === selected));
  classesEl.innerHTML = "";
  updateStatus(list, selected);
  if (!list.length) { classesEl.innerHTML = '<div class="empty"><strong>No classes scheduled</strong><br><span>Enjoy your day! 🎉</span></div>'; return; }
  list.forEach(([time, subject, code, room], index) => {
    const item = document.createElement("article");
    const live = index === liveIndex;
    const next = index === nextIndex && liveIndex < 0;
    const done = viewingToday && !live && parseRange(time)[1] <= currentMinutes();
    item.className = `class${live ? " live" : ""}${done ? " done" : ""}`;
    const type = subject.includes("Lab") ? "LAB" : "CLASS";
    item.innerHTML = `<div class="time">${time}</div><div class="card${live ? " live" : ""}${next ? " next" : ""}"><div class="subject">${subject}</div><div class="code">${code}</div><div class="code">📍 ${room}</div><span class="type">${type}</span>${live ? '<span class="live-pill"><span class="live-dot"></span>LIVE NOW</span>' : next ? '<span class="next-pill">NEXT</span>' : ""}</div>`;
    classesEl.appendChild(item);
  });
  if (autoScroll && liveIndex >= 0) setTimeout(() => classesEl.children[liveIndex]?.scrollIntoView({behavior:"smooth", block:"center"}), 150);
}
order.forEach(day => { const b = document.createElement("button"); b.type="button"; b.className="day"; b.dataset.day=day; b.textContent=short[day]; if(day===todayName()) b.classList.add("today-day"); b.addEventListener("click",()=>render(day)); dayEl.appendChild(b); });
todayJumpEl.addEventListener("click", () => render(todayName(), true));
const initialDay = order.includes(todayName()) ? todayName() : "Monday";
render(initialDay, true);
setInterval(() => {
  if (selectedDay === todayName()) render(selectedDay);
}, 1000);
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
